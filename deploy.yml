name: Deploy to Cloudflare Workers

# This runs automatically every time you push to the main branch.
# It uses Cloudflare's own official deploy tool, authenticated with an
# access token generated from Cloudflare's own dashboard - so it never
# needs to "install an app" on GitHub, and never touches the broken
# email-verification screen that caused trouble with Netlify.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
